repos:
  - repo: https://github.com/hhatto/autopep8
    rev: v2.3.0
    hooks:
      - id: autopep8

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v2.2.3
    hooks:
      # Disabled: breaks f-strings that nest quotes (e.g. f"...{x['k']}...").
      # See formatting PR fallout; re-enable only with a safer quote policy.
      # - id: double-quote-string-fixer
      - id: trailing-whitespace
      - id: end-of-file-fixer
        exclude: ^(cdk)/tests/unit/snapshots
      - id: pretty-format-json
        args: ['--autofix', '--no-sort-keys', '--indent=4', '--no-ensure-ascii']
        exclude: ^(cdk)/tests/unit/snapshots
      - id: check-yaml
