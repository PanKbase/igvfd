name: CI

# Cypress E2E intentionally omitted: upstream workflow cloned IGVF-DACC/igvfd.
# Optional future: add a Cypress job targeting PanKbase/igvfd.
# Coveralls omitted.

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

concurrency:
  group: igvfd-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install pre-commit
        run: pip install pre-commit==2.17.0
      - name: Cache pre-commit hooks
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-py3.11-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Run pre-commit
        run: pre-commit run --all-files

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Set folder permissions for mounted volume
        run: |
          sudo useradd -u 1444 -M igvfd || true
          sudo chown -R "$USER:1444" ./
          chmod -R g+w ./
      - name: Build test images
        run: docker compose -f docker-compose.test.yml build
      - name: Run non-indexing pytest
        run: docker compose -f docker-compose.test.yml up --exit-code-from pyramid --abort-on-container-exit
      - name: Collect test results
        if: failure()
        run: |
          mkdir -p test-results
          if [ -d .test-results ]; then cp -r .test-results/* test-results/ || true; fi
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results-non-indexing
          path: test-results
          if-no-files-found: ignore

  test-indexing:
    name: test-indexing
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Set folder permissions for mounted volume
        run: |
          sudo useradd -u 1444 -M igvfd || true
          sudo chown -R "$USER:1444" ./
          chmod -R g+w ./
      - name: Build indexer test images
        run: docker compose -f docker-compose.test-indexer.yml build
      - name: Run indexing pytest
        run: docker compose -f docker-compose.test-indexer.yml up --exit-code-from indexer-tests --abort-on-container-exit
      - name: Collect test results
        if: failure()
        run: |
          mkdir -p test-results
          if [ -d .test-results ]; then cp -r .test-results/* test-results/ || true; fi
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results-indexing
          path: test-results
          if-no-files-found: ignore

  cdk:
    name: cdk
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            cdk/requirements.txt
            cdk/requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Python deps
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: mypy
        run: mypy .
      - name: cdk unit tests
        run: pytest tests/
      - name: lambda runtime tests
        working-directory: cdk/infrastructure/runtime/lambdas/snapshot
        run: |
          pip install -r requirements.txt -r requirements-dev.txt
          pytest tests/

  opensearch-mappings:
    name: opensearch-mappings
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Set folder permissions for mounted volume
        run: |
          sudo useradd -u 1444 -M igvfd || true
          sudo chown -R "$USER:1444" ./
          chmod -R g+w ./
      - name: Build images
        run: docker compose -f docker-compose.yml build
      - name: Diff OpenSearch mappings
        run: docker compose -f docker-compose.yml run --rm pyramid /scripts/pyramid/diff-opensearch-mappings.sh
